services:
  db:
    image: postgres:17-alpine
    container_name: wartungstermine-db
    env_file:
      - apps/api/.env
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mail catcher for local/dev: every email the API sends lands here
  # instead of a real inbox. Web UI at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: wartungstermine-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wartungstermine-api
    env_file:
      - apps/api/.env
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
